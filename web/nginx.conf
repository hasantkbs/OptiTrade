# Internal static file server for the OptiTrade SPA build. Runs behind
# the host's own Algorix system nginx (which strips the /optitrade/
# prefix before proxying here - see /etc/nginx/sites-available/
# algorixstudio) - this config therefore serves at its own root, and
# never needs to know about that prefix itself. Base image is
# nginxinc/nginx-unprivileged, so this listens on 8080, not 80, and
# already runs as a non-root user.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file (a client
    # route like /portfolio, or a direct refresh on one) resolves to the
    # app shell instead of a 404 - React Router then reads the real
    # browser URL and renders the right screen client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed by Vite (e.g. _assets/index-abcd123.js)
    # - safe to cache aggressively. index.html itself is deliberately NOT
    # matched by this location (it falls through to `location /` above),
    # so a deploy is always picked up on next load. Deliberately
    # `/_assets/`, not `/assets/` - the app has its own real /assets and
    # /assets/:symbol client routes (see vite.config.ts's `assetsDir`).
    location /_assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
}
