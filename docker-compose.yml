# ── Shared config (SERVER STEP 6) ───────────────────────────────────────────────
# Every service's container logs go to stdout/stderr, captured by Docker's
# default json-file driver - which has NO size limit by default. Capped
# here at 3 x 10MB = 30MB per container so a noisy/long-running deployment
# can't slowly fill the host disk. Not a centralized logging system (out
# of this step's scope) - just a bound on local log growth.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  optitrade-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  optitrade-postgres-data:
  optitrade-redis-data:
  optitrade-letsencrypt:        # certbot's /etc/letsencrypt - certs + account keys, never in git
  optitrade-certbot-webroot:    # ACME HTTP-01 challenge files, shared between `proxy` and `certbot`
  optitrade-postgres-backups:   # pg_dump output (SERVER STEP 6) - deliberately NOT the Postgres
                                 # data directory itself; see scripts/backup-postgres.sh

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── Reverse proxy (SERVER STEP 5) — the only public entry point ────────────
  proxy:
    image: nginx:1.27-alpine
    container_name: optitrade-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Soft default (not :?required): compose interpolates every ${...}
      # in this file up front, even for `docker compose up api postgres`
      # invocations that never touch `proxy` at all (local dev, SERVER
      # STEP 1-4's own verification) - a hard requirement here would
      # break those. "localhost" is an obvious placeholder, not a real
      # domain; `proxy` itself won't actually come up cleanly without a
      # real DOMAIN and an issued certificate (see docs/deployment/
      # https-reverse-proxy.md) - which is the correct failure mode for
      # an actual production deployment that forgot to set it.
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - optitrade-letsencrypt:/etc/letsencrypt:ro
      - optitrade-certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - optitrade-net
    restart: unless-stopped
    logging: *default-logging
    # nginx itself is extremely lightweight - this is a generous safety
    # ceiling against a runaway worker process, not a tuned budget.
    mem_limit: 128m
    cpus: "0.5"

  # ── Let's Encrypt certificate issuance/renewal (SERVER STEP 5) ─────────────
  # Not started by `docker compose up` (profile-gated). Issue a cert once:
  #   docker compose --profile certbot run --rm certbot certonly \
  #     --webroot -w /var/www/certbot -d "$DOMAIN" \
  #     --email you@example.com --agree-tos --no-eff-email
  # then start the renewal loop: docker compose --profile certbot up -d certbot
  # See docs/deployment/https-reverse-proxy.md for the full procedure.
  certbot:
    image: certbot/certbot:latest
    container_name: optitrade-certbot
    profiles: ["certbot"]
    volumes:
      - optitrade-letsencrypt:/etc/letsencrypt
      - optitrade-certbot-webroot:/var/www/certbot
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
    networks:
      - optitrade-net
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    cpus: "0.25"

  # ── PostgreSQL backup (SERVER STEP 6) ───────────────────────────────────────
  # Runs scripts/backup-postgres.sh immediately on start (a fresh baseline
  # backup is wanted right away - unlike the app's own startup-training
  # fix in SERVER STEP 3, there is no expensive-work-on-every-restart
  # concern for a single pg_dump), then every 24h. Same minimal-loop
  # pattern as `certbot` above - not a new application scheduler, no
  # relation to/reuse of either PostgreSQL advisory lock (727001/727002)
  # this backend already uses. See docs/deployment/postgres-backups.md
  # for the restore procedure and retention policy.
  backup:
    image: postgres:17
    container_name: optitrade-backup
    environment:
      - FEATURE_STORE_POSTGRES_HOST=postgres
      - FEATURE_STORE_POSTGRES_PORT=5432
      - FEATURE_STORE_POSTGRES_DB=${FEATURE_STORE_POSTGRES_DB:-optitrade}
      - FEATURE_STORE_POSTGRES_USER=${FEATURE_STORE_POSTGRES_USER:-optitrade_user}
      - FEATURE_STORE_POSTGRES_PASSWORD=${FEATURE_STORE_POSTGRES_PASSWORD:?required}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_DIR=/backups
    volumes:
      - ./scripts/backup-postgres.sh:/backup-postgres.sh:ro
      - ./scripts/backup-entrypoint.sh:/backup-entrypoint.sh:ro
      - optitrade-postgres-backups:/backups
    # Starts as root (no `user:` override) specifically so
    # backup-entrypoint.sh can fix /backups' ownership once, then drops
    # to the postgres:17 image's own `postgres` user for everything
    # else - see that script's own header for why.
    entrypoint: sh /backup-entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - optitrade-net
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: "0.5"

  # ── API (always starts) ────────────────────────────────────────────────────
  api:
    build: ./backend
    container_name: optitrade-api
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Absolute container path, overriding whatever CWD-relative value
      # .env carries - WORKDIR is /app/src, not /app, so a relative
      # default would resolve to the wrong place (see backend/.env.example).
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
      - FEATURE_STORE_POSTGRES_HOST=postgres
      - FEATURE_STORE_POSTGRES_PORT=5432
      - FEATURE_STORE_POSTGRES_DB=${FEATURE_STORE_POSTGRES_DB:-optitrade}
      - FEATURE_STORE_POSTGRES_USER=${FEATURE_STORE_POSTGRES_USER:-optitrade_user}
      - FEATURE_STORE_POSTGRES_PASSWORD=${FEATURE_STORE_POSTGRES_PASSWORD:?required}
      - FEATURE_STORE_REDIS_HOST=redis
      - FEATURE_STORE_REDIS_PORT=6379
      - FEATURE_STORE_REDIS_DB=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - optitrade-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    # Generous ceiling, not a tuned budget (SERVER STEP 6) - 2 uvicorn
    # workers (Dockerfile) each independently loading
    # xgboost/tensorflow/catboost/lightgbm models and running yfinance/
    # pandas analysis; a tight limit here risks an OOM-kill of a
    # legitimate request rather than actually protecting anything. Still
    # bounded, so one runaway process can't starve Postgres/Redis/nginx
    # on the same host.
    mem_limit: 4g
    cpus: "2.0"

  # ── Frontend (Algorix integrated deployment) ────────────────────────────────
  # Static SPA build served by a small non-root nginx container. Not
  # part of the OptiTrade backend network - it needs no access to
  # postgres/redis/api at all, only a loopback host port so the host's
  # existing Algorix system nginx can reverse-proxy /optitrade/ to it
  # (see /etc/nginx/sites-available/algorixstudio). Never bound to
  # 0.0.0.0 - matches the loopback-only convention already used for
  # `api`/`redis` in docker-compose.override.yml.
  frontend:
    build: ./web
    container_name: optitrade-frontend
    ports:
      - "127.0.0.1:4010:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *default-logging
    # A static file server has negligible resource needs - generous
    # safety ceiling, not a tuned budget.
    mem_limit: 128m
    cpus: "0.25"

  postgres:
    image: postgres:17
    container_name: optitrade-postgres
    environment:
      - POSTGRES_DB=${FEATURE_STORE_POSTGRES_DB:-optitrade}
      - POSTGRES_USER=${FEATURE_STORE_POSTGRES_USER:-optitrade_user}
      - POSTGRES_PASSWORD=${FEATURE_STORE_POSTGRES_PASSWORD:?required}
    volumes:
      - optitrade-postgres-data:/var/lib/postgresql/data
    networks:
      - optitrade-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FEATURE_STORE_POSTGRES_USER:-optitrade_user} -d ${FEATURE_STORE_POSTGRES_DB:-optitrade}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    # Conservative default for a single-tenant deployment on modest
    # hardware; Postgres itself will use less than this under light/
    # moderate load (this project's actual current scale) via its own
    # shared_buffers/work_mem defaults, which stay well under 1GB.
    mem_limit: 1g
    cpus: "1.0"

  # ── Redis (cache + message broker) ────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: optitrade-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    # No host port mapping: only `api` needs to reach Redis, over the
    # internal optitrade-net network (matching `postgres`, which was
    # already internal-only) - a public 6379 was previously exposed to
    # the host with no auth in front of it.
    volumes:
      - optitrade-redis-data:/data
    networks:
      - optitrade-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging
    # Redis already self-limits via --maxmemory 256mb above; this is
    # just a hard container ceiling slightly above that for process
    # overhead, not a second independent budget.
    mem_limit: 320m
    cpus: "0.5"
