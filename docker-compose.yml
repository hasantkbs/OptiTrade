version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  optitrade-net:
    driver: bridge

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── API (always starts) ────────────────────────────────────────────────────
  api:
    build: ./backend
    container_name: optitrade-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://optitrade:optitrade@postgres:5432/optitrade
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - optitrade-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Redis (cache + message broker) ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: optitrade-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - optitrade-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + TimescaleDB (Phase 3 — analysis persistence) ─────────────
  # Start the full stack with: docker compose --profile db up
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: optitrade-postgres
    profiles: ["db"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: optitrade
      POSTGRES_PASSWORD: optitrade
      POSTGRES_DB: optitrade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - optitrade-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optitrade -d optitrade"]
      interval: 10s
      timeout: 5s
      retries: 5
